<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening link…</title>
<style>
:root { --bg: #f5f6f8; --card: #fff; --text: #1b1f24; --muted: #5f6b7a; --accent: #128c4a; --accent-text: #fff; }
@media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1a1f25; --text: #e8ebef; --muted: #9aa5b1; --accent: #2fbf71; --accent-text: #0b1a12; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
main { background: var(--card); border-radius: 14px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.08); }
h1 { font-size: 19px; margin: 0 0 6px; }
p { color: var(--muted); margin: 0 0 18px; word-break: break-word; }
.host { color: var(--text); font-weight: 600; }
a.btn { display: inline-block; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600;
  padding: 10px 18px; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening your link…</h1>
  <p id="msg">One moment.</p>
  <a id="go" class="btn" href="#" hidden>Continue</a>
</main>
<script>
// Link opener for the team's WhatsApp reminders. The message's button points
// here with ?u=<the real link, base64url-encoded>; this page shows where it
// goes and forwards the parent there.
(function () {
  var title = document.getElementById("title"), msg = document.getElementById("msg"), go = document.getElementById("go");
  function fail(text) { title.textContent = "This link doesn't work"; msg.textContent = text; }
  var code = new URLSearchParams(location.search).get("u") || "";
  var url = "";
  try {
    var b64 = code.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    url = new TextDecoder().decode(bytes).trim();
  } catch (e) { url = ""; }
  var dest;
  try { dest = new URL(url); } catch (e) { dest = null; }
  if (!dest || (dest.protocol !== "https:" && dest.protocol !== "http:")) {
    fail("The link in the message is missing or damaged. Please ask the parent admins for it.");
    return;
  }
  var host = document.createElement("span");
  host.className = "host";
  host.textContent = dest.hostname.replace(/^www\./, "");
  msg.textContent = "Taking you to ";
  msg.appendChild(host);
  go.href = dest.href;
  go.hidden = false;
  setTimeout(function () { location.replace(dest.href); }, 1200);
})();
</script>
</body>
</html>
